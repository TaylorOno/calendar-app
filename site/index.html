<!doctype html>
<html class="no-js" lang="">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Denver Industry Event Calendar</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="description" content="">

    <meta property="og:title" content="">
    <meta property="og:type" content="">
    <meta property="og:url" content="">
    <meta property="og:image" content="">
    <meta property="og:image:alt" content="">

    <link rel="icon" href="/site/favicon.ico" sizes="any">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#fafafa">

    <!-- STANDARD JS -->
    <script src="js/fullcalendar.global.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/events.js"></script>
    <script src="js/upcoming-events.js"></script>

    <!-- THEME JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/global.js"></script>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Dancing+Script:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- STYLESHEETS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/skeleton.css' rel='stylesheet'/>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/theme.css' rel='stylesheet'/>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/palettes/purple.css' rel='stylesheet'/>
    <style>
        :root {
            --fc-button-bg-color: #002868;
            --fc-button-border-color: #002868;
            --fc-button-hover-bg-color: #BF0A30;
            --fc-button-hover-border-color: #BF0A30;
            --fc-button-active-bg-color: #BF0A30;
            --fc-button-active-border-color: #BF0A30;
            --fc-event-bg-color: #002868;
            --fc-event-border-color: #002868;
            --fc-today-bg-color: rgba(255, 215, 0, 0.1);
        }

        .fc-toolbar-title {
            color: #002868;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var calendarEl = document.getElementById("calendar");
            var popover = document.getElementById("event-popover");

            function showEventDetails(event, clickEvent) {
                clickEvent.preventDefault();
                clickEvent.stopPropagation();

                document.getElementById("event-popover-title").textContent = event.title;
                document.getElementById("event-popover-date").textContent = event.allDay
                    ? event.start.toLocaleDateString(undefined, {dateStyle: "full"})
                    : event.start.toLocaleString(undefined, {dateStyle: "full", timeStyle: "short"}) +
                    (event.end ? " - " + event.end.toLocaleTimeString(undefined, {timeStyle: "short"}) : "");
                document.getElementById("event-popover-description").innerHTML = event.extendedProps.description || "";
                document.getElementById("event-popover-location").textContent = event.extendedProps.location ? "Location: " + event.extendedProps.location : "";
                let category = document.getElementById("event-popover-category");
                category.textContent = event.extendedProps.category ? event.extendedProps.category : "";

                // Use the event's color or fallback to blue
                let eventColor = event.backgroundColor || event.color || "#002868";
                category.style.backgroundColor = eventColor;
                category.style.color = "#FFF";

                popover.classList.add("is-open");
                popover.setAttribute("aria-hidden", "false");
                document.getElementById("event-popover-close").focus();
            }

            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: (window.innerWidth < 768) ? "listWeek" : "dayGridMonth",
                navLinks: true, // can click day/week names to navigate views
                dayMaxEvents: true, // allow "more" link when too many events
                headerToolbar: {
                    left: "prev,next today",
                    center: "title",
                    right: (window.innerWidth < 768) ? "listWeek,dayGridMonth" : "timeGridDay,dayGridWeek,dayGridMonth"
                },
                buttonText: {
                    today: "Today",
                    day: "Day",
                    week: "Week",
                    month: "Month"
                },
                views: {
                    timeGrid: {
                        scrollTime: "09:00:00"
                    },
                    listWeek: {
                        buttonText: "List"
                    }
                },
                events: events,
                eventClick: function (info) {
                    showEventDetails(info.event, info.jsEvent);
                }
            });

            // For mobile compatibility: ensuring elements have a cursor pointer or are clickable
            calendarEl.style.cursor = "pointer";

            // Fix for some mobile browsers (iOS) to recognize non-interactive elements as clickable
            document.addEventListener("touchstart", function () {
            }, {passive: true});

            window.addEventListener("resize", function () {
                if (window.innerWidth < 768) {
                    if (calendar.view.type !== "listWeek" && calendar.view.type !== "dayGridMonth") {
                        calendar.changeView("listWeek");
                    }
                } else {
                    if (calendar.view.type === "listWeek") {
                        calendar.changeView("dayGridMonth");
                    }
                }
            });

            calendar.render();

            var closePopover = function () {
                popover.classList.remove("is-open");
                popover.setAttribute("aria-hidden", "true");
            };
            document.getElementById("event-popover-add").addEventListener("click", function () {
                // To be implemented: add to personal calendar logic
            });
            document.getElementById("event-popover-close").addEventListener("click", closePopover);
            document.addEventListener("keydown", function (event) {
                if (event.key === "Escape") closePopover();
            });
            document.addEventListener("click", function (event) {
                if (popover.classList.contains("is-open") && !popover.contains(event.target) && !event.target.closest(".fc-event")) {
                    closePopover();
                }
            });
        });
    </script>
</head>

<body>
<header class="co-header">
    <div class="header-content">
        <h1>Denver Industry Events</h1>
    </div>
</header>

<nav>
    <div class="nav-container">
        <ul>
            <li><a href="#home-section">Home</a></li>
            <li>
                <a href="#submit-event-section">Submit Event</a>
            </li>
            <li><a href="#calendar-section">Calendar</a></li>
            <li><a href="#upcoming-events-section">Upcoming events</a></li>
        </ul>
    </div>
</nav>

<main id="main-content">
    <section id="home-section">
        <div class="home-quote-container">
            <p class="home-quote-text">It's like a jungle sometimes<br> it makes me wonder how I keep from going under</p>
        </div>
    </section>
    <section id="submit-event-section">
        <iframe class="submit-event-iframe"
                src="https://docs.google.com/forms/d/e/1FAIpQLSdEUzqHDnSDVY6t4dpUjvbSuOCwDcIkHhLcKNfqhr9DfBLvcA/viewform?embedded=true"
                title="Submit Event Form">Loading…</iframe>
    </section>
    <section id="upcoming-events-section">
        <div class="upcoming-events-container">
            <h2>Upcoming Events</h2>
            <div id="upcoming-events-list" class="upcoming-events-list">
                <p class="loading-events">Loading upcoming events…</p>
            </div>
        </div>
    </section>
    <section id="calendar-section"><div id="calendar"></div></section>
    <aside id="event-popover" class="event-popover" role="dialog" aria-labelledby="event-popover-title" aria-hidden="true">
        <button id="event-popover-close" class="event-popover-close" type="button" aria-label="Close event details">&times;</button>
        <h2 id="event-popover-title"></h2>
        <div class="category" id="event-popover-category"></div>
        <p id="event-popover-date"></p>
        <p id="event-popover-description"></p>
        <p id="event-popover-location"></p>
        <button id="event-popover-add" class="event-popover-add" type="button">Add to calendar</button>
    </aside>
</main>

<footer class="footer">
    <div class="footer-content">
    </div>
</footer>

</body>
</html>
